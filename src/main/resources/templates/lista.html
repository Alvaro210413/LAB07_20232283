<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/base :: head('Inicio principal')}"></head>
<body>
<div class="container">

    <nav th:replace="~{fragments/header :: navbar('producto')}"></nav>

    <h2 class="text-center">Lista de Productos para la Venta</h2>

    <a class="btn btn-primary btn-sm my-3" th:href="@{/juegos/nuevo}">
        <i class="bi bi-plus-circle"></i> Nuevo Producto
    </a>

    <div th:if="${msg != null}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill"></i> <span th:text="${msg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${msgError != null}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle-fill"></i> <span th:text="${msgError}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <table class="table table-striped align-middle small">
        <thead>
        <tr>
            <th>#</th>
            <th></th>
            <th>Nombre</th>
            <th>Precio (S/)</th>
            <th>Stock</th>
            <th></th>
            <th></th>
        </tr>
        </thead>
        <tbody>

        <tr th:each="producto, stat : ${listaProductos}">
            <td th:text="${stat.count}"></td>
            <td>
                <span th:text="${producto.name}"></span>
            </td>
            <td th:text="${juego.precio}"></td>
            <td th:text="${juego.stock}"></td>

            <td>
                <a class="btn btn-primary btn-sm" th:href="@{/producto/editar(id=${producto.id})}">
                    <i class="bi bi-pencil-square"></i>
                </a>
            </td>

            <td>
                <a class="btn btn-danger btn-sm" th:href="@{/producto/borrar(id=${producto.id})}"
                   onclick="return confirm('¿Seguro que deseas borrar este juego?')">
                    <i class="bi bi-trash-fill"></i>
                </a>
            </td>
        </tr>
        </tbody>
    </table>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
</div>
<th:block th:replace="~{fragments/base :: scripts}"></th:block>
</body>
</html>
